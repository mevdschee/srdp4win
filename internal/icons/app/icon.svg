<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D91"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42A5F5"/>
      <stop offset="1" stop-color="#1E88E5"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43A047"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <!-- A drop shadow in SVG 1.1 primitives: Inkscape 1.2 does not draw
           feDropShadow and leaves the whole group out. -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.22"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="54" y="70" width="148" height="96" rx="5"/>
    </clipPath>
  </defs>

  <!-- background tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- connection arcs -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round">
    <path d="M34 62 A14 14 0 0 1 46 50"/>
    <path d="M22 62 A26 26 0 0 1 46 38"/>
  </g>

  <!-- monitor -->
  <g filter="url(#shadow)">
    <rect x="112" y="172" width="32" height="20" fill="#E3EAF5"/>
    <rect x="80" y="188" width="96" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="48" y="64" width="160" height="108" rx="11" fill="#FFFFFF"/>
    <rect x="54" y="70" width="148" height="96" rx="5" fill="url(#screen)"/>
    <!-- shine -->
    <polygon points="54,70 120,70 54,136" fill="#FFFFFF" fill-opacity="0.14" clip-path="url(#screenClip)"/>
    <!-- generic remote window -->
    <rect x="70" y="86" width="84" height="56" rx="5" fill="#FFFFFF"/>
    <rect x="70" y="86" width="84" height="14" rx="5" fill="#BBDEFB"/>
    <rect x="70" y="95" width="84" height="5" fill="#BBDEFB"/>
    <circle cx="79" cy="93" r="2.6" fill="#1565C0"/>
    <circle cx="87" cy="93" r="2.6" fill="#1565C0"/>
    <circle cx="95" cy="93" r="2.6" fill="#1565C0"/>
    <rect x="78" y="108" width="40" height="5" rx="2.5" fill="#BBDEFB"/>
    <rect x="78" y="118" width="56" height="5" rx="2.5" fill="#BBDEFB"/>
    <rect x="78" y="128" width="30" height="5" rx="2.5" fill="#BBDEFB"/>
  </g>

  <!-- security shield -->
  <g filter="url(#shadow)">
    <path d="M188 128 L224 141 V172 C224 197 209 213 188 222 C167 213 152 197 152 172 V141 Z"
          fill="url(#shield)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    <!-- padlock -->
    <path d="M178 170 V161 A10 10 0 0 1 198 161 V170" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
    <rect x="171" y="168" width="34" height="27" rx="5" fill="#FFFFFF"/>
    <circle cx="188" cy="179" r="4" fill="#2E7D32"/>
    <rect x="186" y="181" width="4" height="8" rx="2" fill="#2E7D32"/>
  </g>
</svg>
