<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    The srdp4win icon: a remote desktop (monitor) guarded by SSH (shield).
    Kept to three bold shapes on a 16 unit grid, without shadows or detail,
    so it stays readable at 16 px (one grid unit is one pixel there).
    Rendered to PNG by tools/genicon.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D91"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- monitor: white frame, blue screen, stand -->
  <rect x="32" y="48" width="176" height="128" rx="18" fill="#FFFFFF"/>
  <rect x="48" y="64" width="144" height="96" rx="6" fill="#42A5F5"/>
  <rect x="96" y="176" width="32" height="24" fill="#FFFFFF"/>
  <rect x="64" y="192" width="96" height="16" rx="8" fill="#FFFFFF"/>

  <!-- shield, cut out of the monitor by an outline in the tile's colour -->
  <path d="M184 112 L232 128 V168 C232 200 212 222 184 234 C156 222 136 200 136 168 V128 Z"
        fill="#43A047" stroke="#1259B0" stroke-width="14" stroke-linejoin="round"/>
  <path d="M162 170 L178 186 L207 154" fill="none" stroke="#FFFFFF" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
